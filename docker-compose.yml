# Neo4j for aiscoring's rule history. Separate from AIScoring's container (7474/7687) because
# both rebuild by wiping the whole database.
# Bound to 127.0.0.1: the graph holds case numbers, rule names and user/host names from a live tenant.
services:
  neo4j:
    image: neo4j:5-community
    container_name: aiscoring-plugin-neo4j
    ports:
      - '127.0.0.1:7475:7474' # browser UI
      - '127.0.0.1:7688:7687' # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH, e.g. neo4j/some-long-password}
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data:
